<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redefinir palavra-passe — Batardas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<link rel="icon" href="img/logo.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-box">
    <img class="logo" src="img/logo.png" alt="Batardas">
    <p style="color:var(--ink-suave); margin-top:-8px;">Definir nova palavra-passe</p>

    <div id="blocoFormulario" style="display:none;">
        <div style="position:relative;">
            <input id="novaPassword" type="password" placeholder="Nova palavra-passe" autocomplete="new-password" style="width:100%; padding-right:40px;">
            <button type="button" id="btnMostrarPassword" aria-label="Mostrar palavra-passe" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; padding:4px; cursor:pointer; color:var(--ink-suave);">
                <i class="ti ti-eye" id="iconeMostrarPassword" style="font-size:18px;" aria-hidden="true"></i>
            </button>
        </div>
        <input id="confirmarPassword" type="password" placeholder="Confirmar palavra-passe" autocomplete="new-password">
        <button id="btnGuardar">Guardar nova palavra-passe</button>
    </div>

    <p id="erro" class="erro"></p>
    <p id="mensagemSucesso" style="font-size:14px; color:var(--sucesso, #2f7a4d); display:none;"></p>
</div>

<script src="js/supabaseClient.js"></script>
<script>
// O Supabase estabelece a sessão de recuperação sozinho a partir do link
// do email (lê o token que vem no URL) — só mostramos o formulário depois
// de confirmar que essa sessão ficou activa.
supabaseClient.auth.onAuthStateChange((evento, session) => {
    if (evento === "PASSWORD_RECOVERY" && session) {
        document.getElementById("blocoFormulario").style.display = "block";
    }
});

// Alguns browsers já têm a sessão pronta antes do evento disparar —
// confirma também directamente, para não ficar preso no ecrã vazio.
(async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) document.getElementById("blocoFormulario").style.display = "block";
    else {
        setTimeout(async () => {
            const { data: { session: sessaoAtrasada } } = await supabaseClient.auth.getSession();
            if (sessaoAtrasada) {
                document.getElementById("blocoFormulario").style.display = "block";
            } else {
                document.getElementById("erro").textContent = "Link inválido ou expirado — pede um novo em 'Esqueci-me da palavra-passe' no ecrã de login.";
            }
        }, 1500);
    }
})();

document.getElementById("btnMostrarPassword").addEventListener("click", () => {
    const campos = [document.getElementById("novaPassword"), document.getElementById("confirmarPassword")];
    const icone = document.getElementById("iconeMostrarPassword");
    const aVerAgora = campos[0].type === "text";
    campos.forEach((c) => c.type = aVerAgora ? "password" : "text");
    icone.className = aVerAgora ? "ti ti-eye" : "ti ti-eye-off";
});

document.getElementById("btnGuardar").addEventListener("click", async () => {
    const erroEl = document.getElementById("erro");
    erroEl.textContent = "";
    const novaPassword = document.getElementById("novaPassword").value;
    const confirmar = document.getElementById("confirmarPassword").value;

    if (novaPassword.length < 6) { erroEl.textContent = "A palavra-passe deve ter pelo menos 6 caracteres."; return; }
    if (novaPassword !== confirmar) { erroEl.textContent = "As duas palavras-passe não coincidem."; return; }

    const { error } = await supabaseClient.auth.updateUser({ password: novaPassword });
    if (error) { erroEl.textContent = "Erro ao guardar: " + error.message; return; }

    document.getElementById("blocoFormulario").style.display = "none";
    document.getElementById("mensagemSucesso").textContent = "Palavra-passe alterada. A entrar...";
    document.getElementById("mensagemSucesso").style.display = "block";

    const { data: { session } } = await supabaseClient.auth.getSession();
    const perfil = session ? await obterPerfil(session.user.id) : null;
    setTimeout(() => {
        window.location.href = ROTA_POR_ROLE[perfil?.role] ?? "index.html";
    }, 1500);
});
</script>
</body>
</html>
