<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batardas — Gestão de Encomendas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="icon" href="img/logo.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-box">
    <img class="logo" src="img/logo.png" alt="Batardas">
    <p style="color:var(--ink-suave); margin-top:-8px;">Gestão de Encomendas</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <div style="position:relative;">
        <input id="password" type="password" placeholder="Palavra-passe" autocomplete="current-password" style="width:100%; padding-right:40px;">
        <button type="button" id="btnMostrarPassword" aria-label="Mostrar palavra-passe" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; padding:4px; cursor:pointer; color:var(--ink-suave);">
            <i class="ti ti-eye" id="iconeMostrarPassword" style="font-size:18px;" aria-hidden="true"></i>
        </button>
    </div>
    <label style="display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink-suave); text-align:left; cursor:pointer;">
        <input type="checkbox" id="lembrarUtilizador" style="width:auto;">
        Lembrar o meu email neste computador
    </label>
    <button id="btnLogin">Entrar</button>
    <p style="margin-top:12px;">
        <a href="#" id="linkEsqueciPassword" style="font-size:13px; color:var(--ink-suave);">Esqueci-me da palavra-passe</a>
    </p>
    <p id="erro" class="erro"></p>
    <p id="mensagemRecuperacao" style="font-size:13px; color:var(--sucesso, #2f7a4d); display:none;"></p>
</div>

<script src="js/supabaseClient.js"></script>
<script>
async function tentarLogin() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const erroEl = document.getElementById("erro");
    erroEl.textContent = "";

    if (!email || !password) {
        erroEl.textContent = "Preenche email e palavra-passe.";
        return;
    }

    if (document.getElementById("lembrarUtilizador").checked) {
        localStorage.setItem("batardas_email_lembrado", email);
    } else {
        localStorage.removeItem("batardas_email_lembrado");
    }

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
        erroEl.textContent = "Credenciais inválidas.";
        return;
    }

    const perfil = await obterPerfil(data.user.id);
    if (!perfil) {
        erroEl.textContent = "Perfil não configurado — contacta o Francisco.";
        await supabaseClient.auth.signOut();
        return;
    }

    window.location.href = ROTA_POR_ROLE[perfil.role] ?? "consulta.html";
}

document.getElementById("btnLogin").addEventListener("click", tentarLogin);
document.getElementById("password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") tentarLogin();
});

document.getElementById("btnMostrarPassword").addEventListener("click", () => {
    const campo = document.getElementById("password");
    const icone = document.getElementById("iconeMostrarPassword");
    const aVerAgora = campo.type === "text";
    campo.type = aVerAgora ? "password" : "text";
    icone.className = aVerAgora ? "ti ti-eye" : "ti ti-eye-off";
});

document.getElementById("linkEsqueciPassword").addEventListener("click", async (e) => {
    e.preventDefault();
    const erroEl = document.getElementById("erro");
    const mensagemEl = document.getElementById("mensagemRecuperacao");
    erroEl.textContent = "";
    mensagemEl.style.display = "none";

    const email = document.getElementById("email").value.trim() || prompt("Escreve o teu email para receberes o link de recuperação:");
    if (!email) return;

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + window.location.pathname.replace(/index\.html$/, "") + "redefinir-password.html",
    });
    if (error) { erroEl.textContent = "Não foi possível enviar o email: " + error.message; return; }

    mensagemEl.textContent = "Se esse email existir, foi enviado um link para redefinires a palavra-passe.";
    mensagemEl.style.display = "block";
});

// Pré-preenche o email se foi guardado numa sessão anterior
const emailLembrado = localStorage.getItem("batardas_email_lembrado");
if (emailLembrado) {
    document.getElementById("email").value = emailLembrado;
    document.getElementById("lembrarUtilizador").checked = true;
    document.getElementById("password").focus();
}

// Se já houver sessão activa, salta o login e vai directo ao ecrã do perfil
(async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
        const perfil = await obterPerfil(session.user.id);
        if (perfil) window.location.href = ROTA_POR_ROLE[perfil.role] ?? "consulta.html";
    }
})();
</script>
</body>
</html>
