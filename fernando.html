<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preparação / Armazém — Batardas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="icon" href="img/logo.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout-admin">
<nav class="barra-lateral">
    <div class="marca"><img class="logo" src="img/logo.png" alt="Batardas" style="cursor:pointer;" onclick="irParaInicio()"></div>
    <button class="nav-item activo" data-secao="picking"><i class="ti ti-clipboard-check" aria-hidden="true"></i> Picking</button>
    <button class="nav-item" data-secao="pedidos"><i class="ti ti-clipboard-list" aria-hidden="true"></i> Pedidos <span class="contador" id="contadorPedidos" style="display:none;"></span></button>
    <button class="nav-item" data-secao="movimentos"><i class="ti ti-arrows-exchange" aria-hidden="true"></i> Movimentos de stock</button>
</nav>

<div class="conteudo-admin">
<header>
    <h1 id="tituloSecao">Picking</h1>
    <div>
        <span class="utilizador" id="nomeUtilizador"></span>
        <span class="bloco-sino">
            <button id="botaoSino" onclick="alternarPainelAlertas()" aria-label="Notificações"><i class="ti ti-bell" style="font-size:19px; vertical-align:-4px;" aria-hidden="true"></i><span id="badgeAlertasSino"></span></button>
            <div id="painelAlertas"></div>
        </span>
        <button class="secundario" onclick="terminarSessao()">Sair</button>
    </div>
</header>

<main>
<section class="painel activo" data-secao="picking">
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:14px; margin-bottom:24px;">
        <div class="cartao" style="margin-bottom:0; padding:16px;">
            <p style="font-size:12px; color:var(--ink-suave); margin:0 0 4px; text-transform:uppercase; letter-spacing:.04em;">Para preparar</p>
            <p style="font-size:26px; font-weight:600; margin:0;" id="kpiParaPreparar">—</p>
        </div>
        <div class="cartao" style="margin-bottom:0; padding:16px;">
            <p style="font-size:12px; color:var(--ink-suave); margin:0 0 4px; text-transform:uppercase; letter-spacing:.04em;">Pedidos pendentes</p>
            <p style="font-size:26px; font-weight:600; margin:0;" id="kpiPedidosPendentes">—</p>
        </div>
    </div>

    <div class="cartao">
        <h2>Para preparar (picking)</h2>
        <table>
            <thead><tr><th>Cliente</th><th>Lote a usar</th><th>Entrega</th><th>Acção</th></tr></thead>
            <tbody id="corpoPreparacao"></tbody>
        </table>
    </div>

    <div class="cartao">
        <h2>Histórico recente</h2>
        <table>
            <thead><tr><th>Cliente</th><th>Estado</th></tr></thead>
            <tbody id="corpoHistorico"></tbody>
        </table>
    </div>
</section>

<section class="painel" data-secao="pedidos" id="pedidos">
    <div class="cartao">
        <h2>Pedidos de armazém pendentes</h2>
        <table>
            <thead><tr><th>Artigo</th><th>Quantidade</th><th>Acção</th></tr></thead>
            <tbody id="corpoPedidosPendentes"></tbody>
        </table>
    </div>
</section>

<section class="painel" data-secao="movimentos">
    <div class="cartao">
        <h2>Registar movimento de stock</h2>
        <div class="linha-form">
            <select id="mTipo">
                <option value="Entrada">Entrada</option>
                <option value="Saída">Saída</option>
                <option value="Transferência">Transferência</option>
            </select>
            <select id="mLoteOrigem"></select>
        </div>
        <div class="linha-form">
            <select id="mUnidade">
                <option value="un">Unidades</option>
                <option value="pack">Packs</option>
                <option value="caixa">Caixas</option>
                <option value="palete">Paletes</option>
            </select>
            <input id="mQuantidade" type="number" min="0.01" step="0.01" placeholder="Quantidade">
        </div>
        <div class="linha-form" id="linhaDestino" style="display:none;">
            <select id="mLoteDestino"></select>
            <input id="mQuantidadeDestino" type="number" min="0" step="0.01" placeholder="Quantidade no destino (se diferente)">
        </div>
        <div class="linha-form" id="linhaLocalizacoes" style="display:none;">
            <select id="mLocalizacaoOrigem"><option value="">Zona de origem (opcional)</option></select>
            <select id="mLocalizacaoDestino"><option value="">Zona de destino (opcional)</option></select>
        </div>
        <div class="linha-form">
            <input id="mObservacoes" placeholder="Observações (opcional)">
            <button id="btnMovimento"><i class="ti ti-device-floppy" style="font-size:14px; vertical-align:-2px; margin-right:4px;" aria-hidden="true"></i>Registar</button>
        </div>
        <p id="erroMovimento" class="erro"></p>
    </div>
</section>
</main>
</div>
</div>

<script src="js/supabaseClient.js"></script>
<script>
async function iniciar() {
    const contexto = await exigirRole(["armazem", "admin"]);
    if (!contexto) return;
    document.getElementById("nomeUtilizador").textContent = contexto.perfil.nome;
    await inicializarAlertas();
    await carregar();
    await carregarLotesArtigo();
    await carregarPedidosPendentes();
    await carregarZonas();

    supabaseClient
        .channel("encomendas-fernando")
        .on("postgres_changes", { event: "*", schema: "public", table: "encomendas" }, carregar)
        .subscribe();

    supabaseClient
        .channel("pedidos-fernando")
        .on("postgres_changes", { event: "*", schema: "public", table: "pedidos_armazem" }, carregarPedidosPendentes)
        .subscribe();
}

async function carregarLotesArtigo() {
    const { data, error } = await supabaseClient
        .from("lotes_artigo")
        .select("lote_artigo_id, numero_lote, quantidade_atual, artigos(designacao, unidade)")
        .order("numero_lote");
    if (error) { console.error(error); return; }

    const opcoes = data.length
        ? data.map((l) => `<option value="${l.lote_artigo_id}" data-unidade="${escaparHtml((l.artigos?.unidade || "un").toUpperCase())}">${escaparHtml(l.artigos?.designacao ?? "—")} · lote ${escaparHtml(l.numero_lote)} (${l.quantidade_atual})</option>`).join("")
        : `<option value="">Sem lotes carregados ainda</option>`;
    document.getElementById("mLoteOrigem").innerHTML = opcoes;
    document.getElementById("mLoteDestino").innerHTML = opcoes;
    actualizarRotuloUnidade();
}

function actualizarRotuloUnidade() {
    const loteSelect = document.getElementById("mLoteOrigem");
    const opcaoEscolhida = loteSelect.options[loteSelect.selectedIndex];
    const unidadeReal = opcaoEscolhida?.dataset.unidade || "UN";
    document.getElementById("mUnidade").options[0].textContent = unidadeReal === "UN" ? "Unidades" : unidadeReal;
}
document.getElementById("mLoteOrigem").addEventListener("change", actualizarRotuloUnidade);

async function carregarPedidosPendentes() {
    const { data, error } = await supabaseClient
        .from("pedidos_armazem")
        .select("pedido_id, quantidade, artigos(designacao)")
        .eq("estado", "Pendente")
        .order("data_pedido", { ascending: true });
    if (error) { console.error(error); return; }

    const corpo = document.getElementById("corpoPedidosPendentes");
    corpo.innerHTML = data.length ? "" :
        `<tr><td colspan="3" style="text-align:center; color:var(--ink-suave);">Sem pedidos pendentes.</td></tr>`;
    data.forEach((p) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td data-rotulo="Artigo">${escaparHtml(p.artigos?.designacao ?? "—")}</td>
            <td data-rotulo="Quantidade">${p.quantidade}</td>
            <td data-rotulo="Acção"><button onclick="atenderPedido('${p.pedido_id}')"><i class="ti ti-check" style="font-size:14px; vertical-align:-2px; margin-right:4px;" aria-hidden="true"></i>Atendido</button></td>
        `;
        corpo.appendChild(tr);
    });

    document.getElementById("kpiPedidosPendentes").textContent = data.length;
    const contador = document.getElementById("contadorPedidos");
    if (data.length) { contador.textContent = data.length; contador.style.display = "inline-flex"; }
    else { contador.style.display = "none"; }
}

async function atenderPedido(pedidoId) {
    if (!confirm("Marcar este pedido como atendido? Não há forma de desfazer no site depois.")) return;
    const { data: { session } } = await supabaseClient.auth.getSession();
    const { error } = await supabaseClient
        .from("pedidos_armazem")
        .update({ estado: "Atendido", atendido_por: session.user.id, data_atendimento: new Date().toISOString() })
        .eq("pedido_id", pedidoId);
    if (error) { toast("Erro ao atender: " + error.message, "erro"); return; }
    await supabaseClient.from("alertas").update({ lido: true }).eq("link_id", pedidoId).eq("tipo", "pedido_armazem").eq("destinatario_role", "armazem");
    carregarPedidosPendentes();
    actualizarContadorAlertas();
    toast("Pedido marcado como atendido.", "sucesso");
}

async function carregarZonas() {
    const { data, error } = await supabaseClient.from("localizacoes").select("localizacao_id, nome").order("nome");
    if (error) { console.error(error); return; }
    const opcoes = `<option value="">— nenhuma —</option>` + data.map((z) => `<option value="${z.localizacao_id}">${escaparHtml(z.nome)}</option>`).join("");
    document.getElementById("mLocalizacaoOrigem").innerHTML = opcoes;
    document.getElementById("mLocalizacaoDestino").innerHTML = opcoes;
}

document.getElementById("mTipo").addEventListener("change", (e) => {
    const ehTransferencia = e.target.value === "Transferência";
    document.getElementById("linhaDestino").style.display = ehTransferencia ? "grid" : "none";
    document.getElementById("linhaLocalizacoes").style.display = ehTransferencia ? "grid" : "none";
});

document.getElementById("btnMovimento").addEventListener("click", async () => {
    const erroEl = document.getElementById("erroMovimento");
    erroEl.textContent = "";

    const tipo = document.getElementById("mTipo").value;
    const loteOrigem = document.getElementById("mLoteOrigem").value;
    const unidade = document.getElementById("mUnidade").value;
    const quantidade = Number(document.getElementById("mQuantidade").value);
    const observacoes = document.getElementById("mObservacoes").value.trim();

    if (!loteOrigem || !quantidade) {
        erroEl.textContent = "Escolhe o lote e a quantidade.";
        return;
    }

    const registo = {
        tipo,
        lote_artigo_id: loteOrigem,
        unidade_movimentacao: unidade,
        quantidade,
        observacoes: observacoes || null,
    };

    if (tipo === "Transferência") {
        const loteDestino = document.getElementById("mLoteDestino").value;
        const quantidadeDestino = document.getElementById("mQuantidadeDestino").value;
        const localizacaoOrigem = document.getElementById("mLocalizacaoOrigem").value;
        const localizacaoDestino = document.getElementById("mLocalizacaoDestino").value;
        if (!loteDestino) {
            erroEl.textContent = "Escolhe o lote de destino para a transferência.";
            return;
        }
        registo.lote_artigo_destino_id = loteDestino;
        if (quantidadeDestino) registo.quantidade_destino = Number(quantidadeDestino);
        if (localizacaoOrigem) registo.localizacao_origem_id = localizacaoOrigem;
        if (localizacaoDestino) registo.localizacao_destino_id = localizacaoDestino;
    }

    const { error } = await supabaseClient.from("movimentos_stock").insert(registo);
    if (error) { erroEl.textContent = "Erro ao registar: " + traduzirErro(error.message); return; }

    document.getElementById("mQuantidade").value = "";
    document.getElementById("mObservacoes").value = "";
    carregarLotesArtigo();
    toast("Movimento registado — o Francisco foi avisado.", "sucesso");
});

async function carregar() {
    const { data: paraPreparar, error: erro1 } = await supabaseClient
        .from("encomendas")
        .select("encomenda_id, data_entrega_pretendida, clientes(nome), encomenda_lote(quantidade_alocada, lotes_producao(produto, numero_lote))")
        .eq("estado", "Em Preparação")
        .order("data_entrega_pretendida", { ascending: true });

    const corpoPrep = document.getElementById("corpoPreparacao");
    if (erro1) { console.error(erro1); return; }
    corpoPrep.innerHTML = paraPreparar.length ? "" :
        `<tr><td colspan="4" style="text-align:center; color:var(--ink-suave);">Nada à espera de picking.</td></tr>`;
    paraPreparar.forEach((enc) => {
        const lotes = enc.encomenda_lote.length
            ? enc.encomenda_lote.map((el) => `${escaparHtml(el.lotes_producao?.produto ?? "—")} · lote ${escaparHtml(el.lotes_producao?.numero_lote ?? "—")} (${el.quantidade_alocada})`).join("<br>")
            : `<span style="color:var(--ink-suave);">Sem lote atribuído — confirma com o Francisco</span>`;
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td data-rotulo="Cliente">${escaparHtml(enc.clientes?.nome ?? "—")}</td>
            <td data-rotulo="Lote a usar">${lotes}</td>
            <td data-rotulo="Entrega">${formatarData(enc.data_entrega_pretendida)}</td>
            <td data-rotulo="Acção"><button onclick="marcarPronta('${enc.encomenda_id}')"><i class="ti ti-check" style="font-size:14px; vertical-align:-2px; margin-right:4px;" aria-hidden="true"></i>Picking concluído</button></td>
        `;
        corpoPrep.appendChild(tr);
    });
    document.getElementById("kpiParaPreparar").textContent = paraPreparar.length;

    const { data: historico, error: erro2 } = await supabaseClient
        .from("encomendas")
        .select("clientes(nome), estado")
        .in("estado", ["Pronta", "Carregada"])
        .order("data_hora_carregamento", { ascending: false })
        .limit(10);

    const corpoHist = document.getElementById("corpoHistorico");
    if (erro2) { console.error(erro2); return; }
    corpoHist.innerHTML = "";
    historico.forEach((enc) => {
        const classeEstado = CLASSE_ESTADO[enc.estado] ?? "Registada";
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td data-rotulo="Cliente">${escaparHtml(enc.clientes?.nome ?? "—")}</td>
            <td data-rotulo="Estado"><span class="badge ${classeEstado}">${enc.estado}</span></td>
        `;
        corpoHist.appendChild(tr);
    });
}

async function marcarPronta(encomendaId) {
    const { data: { session } } = await supabaseClient.auth.getSession();
    const { error } = await supabaseClient
        .from("encomendas")
        .update({
            estado: "Pronta",
            data_conclusao_preparacao: new Date().toISOString(),
            preparado_por: session.user.id,
        })
        .eq("encomenda_id", encomendaId);
    if (error) { toast("Erro ao actualizar: " + error.message, "erro"); return; }
    carregar();
    toast("Picking concluído — encomenda pronta para carregar.", "sucesso");
}

const TITULOS_SECAO = { picking: "Picking", pedidos: "Pedidos de armazém", movimentos: "Movimentos de stock" };

function mudarSecao(secao) {
    document.querySelectorAll(".nav-item").forEach((btn) => btn.classList.toggle("activo", btn.dataset.secao === secao));
    document.querySelectorAll(".painel").forEach((p) => p.classList.toggle("activo", p.dataset.secao === secao));
    document.getElementById("tituloSecao").textContent = TITULOS_SECAO[secao] ?? "Picking";
    localStorage.setItem("batardas_secao_fernando", secao);
}
document.querySelectorAll(".nav-item").forEach((btn) => {
    btn.addEventListener("click", () => mudarSecao(btn.dataset.secao));
});
mudarSecao(localStorage.getItem("batardas_secao_fernando") ?? "picking");

iniciar();
</script>
</body>
</html>
